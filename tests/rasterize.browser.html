<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Pixel Statbar hosted artwork test</title>
  <style>
    body {
      background: #182322;
      color: #eee;
      font: 16px monospace;
      padding: 24px;
    }
    img {
      width: 464px;
    }
    pre {
      white-space: pre-wrap;
    }
  </style>
  <h1>Hosted PNG loading test</h1>
  <pre id="result">Running…</pre>
  <div id="images"></div>
  <script type="module">
    import { hostedBarParts } from "/src/hosted-art.ts";
    import { DEFAULT_STATS, DEFAULT_SETTINGS } from "/src/model.ts";
    try {
      const lines = [];
      for (const hp of [100, 75, 50, 25, 1, 0]) {
        const parts = hostedBarParts(
          { ...DEFAULT_STATS, hp, maxHp: 100, tempHp: 8, ac: 18 },
          DEFAULT_SETTINGS,
          { numbers: true, segmented: false, name: "ตัวละครทดสอบ" },
          location.origin,
        );
        for (const part of parts) {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = part.url;
          await img.decode();
          if (
            img.naturalWidth !== part.width ||
            img.naturalHeight !== part.height
          )
            throw Error("Invalid image dimensions");
          if (part.key === "frame")
            document.querySelector("#images").append(img);
        }
        lines.push(`PASS HP=${hp}: all hosted PNG files loaded`);
      }
      document.querySelector("#result").textContent = lines.join("\n");
    } catch (error) {
      document.querySelector("#result").textContent = `FAIL: ${error.stack}`;
    }
  </script>
</html>
